name: CivicMirror Android Build

on:
  push:
    paths:
      - "CivicMirror/**"
      - ".github/workflows/civicmirror-build.yml"
  pull_request:
    paths:
      - "CivicMirror/**"
      - ".github/workflows/civicmirror-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run CivicMirror protocol unit tests
        run: gradle --no-daemon -p CivicMirror :app:testDebugUnitTest

      - name: Build CivicMirror debug APK
        run: gradle --no-daemon -p CivicMirror :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CivicMirror-debug
          path: CivicMirror/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
