name: Build iOSBridge 0.2.8

on:
  workflow_dispatch:
  push:
    paths:
      - "iOSBridge/**"
      - ".github/workflows/iosbridge-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify source tree
        run: |
          test -f iOSBridge/settings.gradle.kts
          test -f iOSBridge/app/build.gradle.kts
          test -f iOSBridge/app/src/main/AndroidManifest.xml
          test -f iOSBridge/app/src/main/java/com/iosbridge/MainActivity.kt

      - name: Build debug APK
        working-directory: iOSBridge
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -s iOSBridge/app/build/outputs/apk/debug/app-debug.apk
          ls -lh iOSBridge/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iOSBridge-0.2.8-debug-apk
          path: iOSBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
