name: Verify hybrid core

on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run hybrid core checks
        run: gradle --no-daemon verifyHybridCore
