name: Build AADisplay integration compile check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android-baseline.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build pinned AADisplay Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hybrid integration repository
        uses: actions/checkout@v4
        with:
          path: hybrid

      - name: Checkout pinned upstream AADisplay source
        uses: actions/checkout@v4
        with:
          repository: Nitsuya/AADisplay
          ref: 494dcc4909e8765e8798be4e7b8031fefd90a4eb
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use runner-provisioned Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - name: Overlay hybrid resolution Binder, service and split lifecycle
        run: |
          mkdir -p upstream/aa-display/src/main/java/io/github/nitsuya/aa/display/util
          mkdir -p upstream/aa-display/src/main/java/io/github/nitsuya/aa/display/ui/aa/split
          mkdir -p upstream/aa-display/src/main/java/io/github/nitsuya/aa/display/xposed
          mkdir -p upstream/aa-display/src/main/aidl/io/github/nitsuya/aa/display/xposed
          cp hybrid/android-overlay/aa-display/src/main/java/io/github/nitsuya/aa/display/util/DisplayResolutionStore.kt \
            upstream/aa-display/src/main/java/io/github/nitsuya/aa/display/util/
          cp hybrid/android-overlay/aa-display/src/main/java/io/github/nitsuya/aa/display/ui/aa/split/SplitVdLifecycle.kt \
            upstream/aa-display/src/main/java/io/github/nitsuya/aa/display/ui/aa/split/
          cp hybrid/android-overlay/aa-display/src/main/java/io/github/nitsuya/aa/display/xposed/CoreManager.kt \
            upstream/aa-display/src/main/java/io/github/nitsuya/aa/display/xposed/
          cp hybrid/android-overlay/aa-display/src/main/java/io/github/nitsuya/aa/display/xposed/CoreManagerService.kt \
            upstream/aa-display/src/main/java/io/github/nitsuya/aa/display/xposed/
          cp hybrid/android-overlay/aa-display/src/main/aidl/io/github/nitsuya/aa/display/xposed/ICoreManager.aidl \
            upstream/aa-display/src/main/aidl/io/github/nitsuya/aa/display/xposed/

          mkdir -p upstream/aa-display/src/main/java/io/github/nitsuya/aa/display/ui/main
          mkdir -p upstream/aa-display/src/main/res/layout
          cp hybrid/android-overlay/aa-display/src/main/java/io/github/nitsuya/aa/display/ui/main/MainActivity.kt \
            upstream/aa-display/src/main/java/io/github/nitsuya/aa/display/ui/main/
          cp hybrid/android-overlay/aa-display/src/main/res/layout/activity_main.xml \
            upstream/aa-display/src/main/res/layout/

      - name: Build upstream debug APK (integration compile check; not final hybrid)
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :aa-display:assembleDebug

      - name: Upload baseline APK for build-chain verification
        uses: actions/upload-artifact@v4
        with:
          name: aadisplay-upstream-baseline-NOT-OPTIMIZED
          path: upstream/aa-display/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
